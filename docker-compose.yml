services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: budgetflow
      POSTGRES_PASSWORD: budgetflow
      POSTGRES_DB: budgetflow_dev
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U budgetflow -d budgetflow_dev']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
