services:
  frontend:
    build: ./frontend
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://budgetflow:budgetflow@db:5432/budgetflow_dev?sslmode=disable
      APP_ENV: dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    build: ./backend
    command: ['migrate', '-path', '/app/migrations', '-database', 'pgx5://budgetflow:budgetflow@db:5432/budgetflow_dev?sslmode=disable', 'up']
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: budgetflow
      POSTGRES_PASSWORD: budgetflow
      POSTGRES_DB: budgetflow_dev
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U budgetflow -d budgetflow_dev']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
